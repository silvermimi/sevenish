<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Tokyo Replay Archive | SEVENISH.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fff;
      color: #111;
      font-family: 'Inter', sans-serif;
    }

    .page {
      width: calc(100% - 40px);
      max-width: 1180px;
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 34px;
      letter-spacing: 1px;
      color: #111;
      text-decoration: none;
    }

    .logo span {
      color: #f12d40;
    }

    nav {
      display: flex;
      gap: 25px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      transition: color .2s ease;
    }

    nav a:hover {
      color: #f12d40;
    }

    .eyebrow {
      color: #f12d40;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 8vw, 85px);
      line-height: .95;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .intro {
      color: #777;
      font-size: 13px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    /* FEATURED BANNER */
    .hero {
      width: 100%;
      aspect-ratio: 1800 / 710;
      background: #ededed;
      overflow: hidden;
      margin-bottom: 34px;
      position: relative;
    }

    .hero img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* Move image downward to reveal faces */
      object-position: center 70%;
    }

    .section-label {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .section-label::after {
      content: "";
      height: 1px;
      flex: 1;
      background: #e5e5e5;
    }

    .concert-list {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .concert-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      padding: 23px 22px;
      border: 1px solid #e8e8e8;
      text-decoration: none;
      color: #111;
      transition: .2s ease;
    }

    .concert-card:hover {
      border-color: #f12d40;
      transform: translateY(-3px);
    }

    .card-info {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .day {
      color: #f12d40;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 27px;
      letter-spacing: .5px;
    }

    .card-subtitle {
      color: #888;
      font-size: 10px;
      letter-spacing: 1px;
    }

    .arrow {
      color: #f12d40;
      font-size: 23px;
    }

    footer {
      border-top: 1px solid #e8e8e8;
      margin-top: 60px;
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      color: #999;
      font-size: 10px;
      letter-spacing: 1px;
    }

    footer strong {
      color: #111;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 1px;
    }

    @media (max-width: 760px) {
      .page {
        width: calc(100% - 30px);
        padding-top: 25px;
      }

      header {
        align-items: flex-start;
        gap: 15px;
      }

      .logo {
        font-size: 29px;
      }

      nav {
        gap: 13px;
        padding-top: 10px;
      }

      nav a {
        font-size: 9px;
      }

      .hero {
        aspect-ratio: 1800 / 710;
      }

      .hero img {
        object-position: center 70%;
      }

      .concert-list {
        grid-template-columns: 1fr;
      }

      footer {
        gap: 15px;
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <header>
      <a href="index.html" class="logo">SEVENISH<span>.</span></a>

      <nav>
        <a href="index.html">HOME</a>
        <a href="concerts.html">CONCERTS</a>
      </nav>
    </header>

    <p class="eyebrow">ARIRANG WORLD TOUR</p>
    <h1>TOKYO REPLAY.</h1>

    <p class="intro">
      Relive the moments. Browse the concert replay archive.
    </p>

    <div class="hero">
      <img src="tokyo.jpg" alt="BTS Tokyo concert banner">
    </div>

    <div class="section-label">REPLAY ARCHIVE</div>

    <div class="concert-list">

      <a class="concert-card"
         href="https://t.me/bangtandept/15"
         target="_blank"
         rel="noopener noreferrer">

        <div class="card-info">
          <span class="day">TOKYO · DAY 01</span>
          <span class="card-title">FULL CONCERT</span>
          <span class="card-subtitle">WATCH THE REPLAY</span>
        </div>

        <span class="arrow">↗</span>
      </a>

      <a class="concert-card"
         href="https://t.me/bangtandept/8"
         target="_blank"
         rel="noopener noreferrer">

        <div class="card-info">
          <span class="day">TOKYO · DAY 02</span>
          <span class="card-title">FULL CONCERT</span>
          <span class="card-subtitle">WATCH THE REPLAY</span>
        </div>

        <span class="arrow">↗</span>
      </a>

    </div>

    <footer>
      <strong>SEVENISH.</strong>
      <span>MADE FOR ARMY · BTS ARIRANG TOUR ARCHIVE</span>
    </footer>

  </main>
</body>
</html>
