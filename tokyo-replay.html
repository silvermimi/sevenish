<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090909">
  <title>Tokyo Replay Archive | SEVENISH.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --red: #f12d40;
      --ink: #101010;
      --muted: #858585;
      --paper: #f1f1f1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: Inter, Arial, sans-serif;
    }

    .page {
      width: min(1180px, calc(100% - 44px));
      margin: 0 auto;
      padding: 28px 0 54px;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e5e5;
      padding-bottom: 17px;
      margin-bottom: 28px;
    }

    .brand {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 28px;
      letter-spacing: 1.2px;
      text-decoration: none;
      color: var(--ink);
    }

    .brand span {
      color: var(--red);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    .back {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.3px;
      color: #555;
      text-decoration: none;
      text-transform: uppercase;
    }

    .back:hover {
      color: var(--red);
    }

    /* BANNER - FULL IMAGE VISIBLE */

    .hero {
      width: 100%;
      height: auto;
      min-height: 0;
      background: #fff;
      overflow: hidden;
      margin-bottom: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 600px;
      object-fit: contain;
      object-position: center;
    }

    .eyebrow {
      color: var(--red);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .heading {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 42px;
      line-height: 1;
      margin: 0 0 9px;
    }

    .sub {
      font-size: 13px;
      line-height: 1.7;
      color: #777;
      margin: 0 0 25px;
    }

    /* REPLAY CARDS */

    .days {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .day {
      background: var(--paper);
      padding: 24px 22px 22px;
      min-height: 190px;
      display: flex;
      flex-direction: column;
    }

    .day-no {
      font-size: 11px;
      color: var(--red);
      font-weight: 900;
      letter-spacing: 1.8px;
      text-transform: uppercase;
    }

    .day h2 {
      font-family: 'Bebas Neue', Impact, sans-serif;
      font-size: 32px;
      margin: 8px 0 6px;
      line-height: 1;
    }

    /* CITY + DATE */

    .day .replay-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 20px;
      font-size: 12px;
      font-weight: 400;
      color: #777;
    }

    .day .replay-city,
    .day .replay-date {
      color: #777;
      font: inherit;
    }

    /* SMALL GRAY DOT */

    .day .meta-dot {
      width: 2px;
      height: 2px;
      min-width: 2px;
      min-height: 2px;
      border-radius: 50%;
      background: #777;
      flex: 0 0 2px;
    }

    /* WATCH BUTTON */

    .watch {
      margin-top: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 54px;
      background: var(--red);
      color: #fff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .7px;
      text-transform: uppercase;
      transition: background .18s, transform .18s;
    }

    .watch:hover {
      background: #c91e30;
      transform: translateY(-2px);
    }

    /* FOOTER */

    .footer {
      margin-top: 40px;
      padding-top: 18px;
      border-top: 1px solid #e5e5e5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: #888;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* MOBILE */

    @media(max-width:760px) {
      .days {
        grid-template-columns: 1fr;
      }

      .hero {
        height: auto;
        min-height: 0;
      }

      .hero img {
        width: 100%;
        height: auto;
        max-height: none;
        object-fit: contain;
      }

      .page {
        width: min(100% - 28px, 560px);
      }

      .day {
        min-height: 170px;
      }
    }

    @media(max-width:420px) {
      .topline {
        align-items: flex-start;
        gap: 14px;
      }

      .nav-links {
        flex-direction: column;
        align-items: flex-end;
        gap: 9px;
      }

      .back {
        font-size: 10px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <nav class="topline">
      <a class="brand" href="index.html">
        SEVENISH<span>.</span>
      </a>

      <div class="nav-links">
        <a class="back" href="index.html">← Back Home</a>
        <a class="back" href="concerts.html">Tour Archive</a>
      </div>
    </nav>

    <!-- BANNER IMAGE -->
    <header class="hero">
      <img src="tokyo.jpg" alt="Tokyo concert banner">
    </header>

    <!-- REPLAY CONTENT -->
    <section>

      <p class="eyebrow">
        ASIA / ARIRANG TOUR
      </p>

      <h2 class="heading">TOKYO</h2>

      <p class="sub">
        Choose a concert day below to watch the replay.
      </p>

      <div class="days">

        <!-- DAY 1 -->
        <article class="day">
          <span class="day-no">01 / CONCERT REPLAY</span>

          <h2>DAY 1</h2>

          <p class="replay-meta">
            <span class="replay-city">TOKYO</span>
            <span class="meta-dot"></span>
            <span class="replay-date">APR 17</span>
          </p>

          <a
            class="watch"
            href="https://t.me/bangtandept/15"
            target="_blank"
            rel="noopener noreferrer"
          >
            Watch replay ↗
          </a>
        </article>

        <!-- DAY 2 -->
        <article class="day">
          <span class="day-no">02 / CONCERT REPLAY</span>

          <h2>DAY 2</h2>

          <p class="replay-meta">
            <span class="replay-city">TOKYO</span>
            <span class="meta-dot"></span>
            <span class="replay-date">APR 18</span>
          </p>

          <a
            class="watch"
            href="https://t.me/bangtandept/8"
            target="_blank"
            rel="noopener noreferrer"
          >
            Watch replay ↗
          </a>
        </article>

      </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
      <span>SEVENISH. · SEVEN MEMBERS. ONE UNIVERSE.</span>
      <span>Made with love for ARMY</span>
    </footer>

  </main>

</body>
</html>
